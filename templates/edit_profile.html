{% extends 'base.html' %}

{% block title %}Edit Academic Profile — ScholarForge{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 580px; margin-top: 2rem;">
    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;">
        <span style="font-size: 1.75rem;">✏️</span>
        <h2 style="margin-bottom: 0;">Edit Academic Profile</h2>
    </div>
    <p class="text-secondary mb-3">Update your profile information visible across ScholarForge publications.</p>
    <hr>
    
    <form method="POST" action="{{ url_for('dashboard.edit_profile') }}">
        <div class="form-group">
            <label for="username">👤 Full Name / Author Name</label>
            <input type="text" id="username" name="username" class="form-control" value="{{ user.username }}" required>
        </div>
        <div class="form-group">
            <label for="email">📧 Email Address</label>
            <input type="email" id="email" class="form-control" value="{{ user.email }}" disabled style="background: rgba(241, 245, 249, 0.7); cursor: not-allowed;">
            <small class="text-muted" style="font-size: 0.8rem; margin-top: 0.25rem; display: block;">🔒 Account email address is locked for verification security.</small>
        </div>
        <div class="gap-row">
            <div class="form-group" style="flex: 1;">
                <label for="institution">🏫 College / Institution</label>
                <input type="text" id="institution" name="institution" class="form-control" placeholder="e.g. Stanford University" value="{{ user.institution or '' }}">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="department">🏢 Department</label>
                <input type="text" id="department" name="department" class="form-control" placeholder="e.g. Computer Science" value="{{ user.department or '' }}">
            </div>
        </div>
        <hr>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <button type="submit" class="btn btn-primary" style="flex: 1; min-width: 140px;">💾 Save Changes</button>
            <a href="{{ url_for('dashboard.profile') }}" class="btn" style="flex: 1; min-width: 140px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
