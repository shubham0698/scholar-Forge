{% extends 'base.html' %}

{% block title %}Change Security Password — ScholarForge{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 520px; margin-top: 2rem;">
    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem;">
        <span style="font-size: 1.75rem;">🔑</span>
        <h2 style="margin-bottom: 0;">Change Password</h2>
    </div>
    <p class="text-secondary mb-3">Update your account access password securely.</p>
    <hr>

    <form method="POST" action="{{ url_for('dashboard.change_password') }}">
        <div class="form-group">
            <label for="current_password">🔒 Current Password</label>
            <input type="password" id="current_password" name="current_password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
            <label for="new_password">✨ New Password</label>
            <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required>
            <small class="text-muted" style="font-size: 0.8rem; margin-top: 0.25rem; display: block;">Must be at least 6 characters long.</small>
        </div>
        <div class="form-group">
            <label for="confirm_password">✅ Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
        <hr>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
            <button type="submit" class="btn btn-primary" style="flex: 1; min-width: 140px;">Update Password</button>
            <a href="{{ url_for('dashboard.profile') }}" class="btn" style="flex: 1; min-width: 140px;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
